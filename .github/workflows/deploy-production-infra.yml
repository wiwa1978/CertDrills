name: Azure Production Infra

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: 1.3.9
  POSTGRES_FIREWALL_RESOURCE_GROUP_NAME: ${{ vars.POSTGRES_FIREWALL_RESOURCE_GROUP_NAME || 'RG-Wim-Wymedia' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'germanywestcentral' }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'RG-CertDrills' }}
      AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME || 'production' }}
      AZURE_ALERT_OPERATOR_EMAIL: ${{ vars.AZURE_ALERT_OPERATOR_EMAIL }}
      APP_NAME: ${{ vars.APP_NAME || 'certdrills' }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'CertDrills' }}
      NEXT_PUBLIC_ADMIN_APP_NAME: ${{ vars.NEXT_PUBLIC_ADMIN_APP_NAME || 'CertDrills Admin' }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_ADMIN_URL: ${{ vars.PUBLIC_ADMIN_URL }}
      COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
      BETTER_AUTH_ALLOWED_ORIGINS: ${{ vars.BETTER_AUTH_ALLOWED_ORIGINS }}
      PAYMENT_PROVIDER: dodo
      DODO_PAYMENTS_ENVIRONMENT: ${{ vars.DODO_PAYMENTS_ENVIRONMENT }}
      DODO_LIVE_MODE_APPROVED: ${{ vars.DODO_LIVE_MODE_APPROVED }}
      INNGEST_APP_ID: ${{ vars.INNGEST_APP_ID || 'certdrills-api' }}
      AZURE_AI_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_FOUNDRY_MODEL: ${{ vars.AZURE_AI_FOUNDRY_MODEL }}
      AZURE_AI_FOUNDRY_TIMEOUT_MS: ${{ vars.AZURE_AI_FOUNDRY_TIMEOUT_MS || '60000' }}
      ADMIN_PORTAL_TOTP_REQUIRED: ${{ vars.ADMIN_PORTAL_TOTP_REQUIRED || 'true' }}
      DODO_CREDITS_BRAND_ID: ${{ vars.DODO_CREDITS_BRAND_ID }}
      DODO_SUBSCRIPTIONS_BRAND_ID: ${{ vars.DODO_SUBSCRIPTIONS_BRAND_ID }}
      DODO_TRANSACTIONS_BRAND_ID: ${{ vars.DODO_TRANSACTIONS_BRAND_ID }}
      POSTGRES_SERVER_FQDN: ${{ vars.POSTGRES_SERVER_FQDN }}
      POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN }}
      POSTGRES_MIGRATION_LOGIN: ${{ vars.POSTGRES_MIGRATION_LOGIN }}
      POSTGRES_RUNTIME_LOGIN: ${{ vars.POSTGRES_RUNTIME_LOGIN }}
      POSTGRES_DATABASE_NAME: ${{ vars.POSTGRES_DATABASE_NAME || 'certdrills' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate Dodo environment
        shell: bash
        run: bash .github/scripts/validate-dodo-environment.sh

      - name: Validate production configuration
        shell: bash
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_MIGRATION_PASSWORD: ${{ secrets.POSTGRES_MIGRATION_PASSWORD }}
          POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BILLING_RECONCILIATION_SECRET: ${{ secrets.BILLING_RECONCILIATION_SECRET }}
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          DODO_PAYMENTS_WEBHOOK_SECRET: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          required_vars=(
            POSTGRES_SERVER_FQDN
            POSTGRES_ADMIN_LOGIN
            POSTGRES_MIGRATION_LOGIN
            POSTGRES_RUNTIME_LOGIN
            AZURE_ALERT_OPERATOR_EMAIL
            POSTGRES_DATABASE_NAME
            POSTGRES_ADMIN_PASSWORD
            POSTGRES_MIGRATION_PASSWORD
            POSTGRES_RUNTIME_PASSWORD
            BETTER_AUTH_SECRET
            JWT_SECRET
            ADMIN_SECRET
            BILLING_RECONCILIATION_SECRET
            DODO_PAYMENTS_API_KEY
            INNGEST_EVENT_KEY
            INNGEST_SIGNING_KEY
            DODO_PAYMENTS_WEBHOOK_SECRET
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required production setting: %s\n' "${name}" >&2
              exit 1
            fi
          done

          if [[ "${POSTGRES_ADMIN_LOGIN}" == "${POSTGRES_MIGRATION_LOGIN}" || "${POSTGRES_ADMIN_LOGIN}" == "${POSTGRES_RUNTIME_LOGIN}" || "${POSTGRES_MIGRATION_LOGIN}" == "${POSTGRES_RUNTIME_LOGIN}" ]]; then
            echo "PostgreSQL administrator, migration, and runtime logins must be distinct." >&2
            exit 1
          fi
          if [[ "${POSTGRES_ADMIN_PASSWORD}" == "${POSTGRES_MIGRATION_PASSWORD}" || "${POSTGRES_ADMIN_PASSWORD}" == "${POSTGRES_RUNTIME_PASSWORD}" || "${POSTGRES_MIGRATION_PASSWORD}" == "${POSTGRES_RUNTIME_PASSWORD}" ]]; then
            echo "PostgreSQL administrator, migration, and runtime passwords must be distinct." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Drizzle migrations
        run: bun run db:check

      - name: Typecheck
        run: bun run typecheck:all

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Select Azure subscription
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Resolve effective Dodo brands
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PAYMENT_PROVIDER}" == "dodo" ]]; then
            active_brand_env="$(bun -e '
              import { applicationConfig } from "./apps/api/src/config/application.ts";
              import { DODO_BRAND_ENV_BY_BILLING_MODE } from "./apps/api/src/config/dodo-brands.ts";
              process.stdout.write(DODO_BRAND_ENV_BY_BILLING_MODE[applicationConfig.billing.mode]);
            ')"
            ACTIVE_DODO_BRAND_ENV="${active_brand_env}" bash .github/scripts/resolve-dodo-brands.sh
          fi

      - name: Resolve or bootstrap Azure infrastructure
        id: infra
        shell: bash
        env:
          POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail

          normalized_name="$(printf '%s' "${APP_NAME}" | tr '[:upper:]_' '[:lower:]-')"
          api_app_name="${normalized_name}-api"
          web_app_name="${normalized_name}-web"
          admin_app_name="${normalized_name}-admin"
          api_app_name="${api_app_name:0:32}"
          web_app_name="${web_app_name:0:32}"
          admin_app_name="${admin_app_name:0:32}"

          resolve_existing=false
          rg_exists="$(az group exists --name "${AZURE_RESOURCE_GROUP_NAME}")"
          if [[ "${rg_exists}" == "true" ]]; then
            existing_count=0
            for app_name in "${api_app_name}" "${web_app_name}" "${admin_app_name}"; do
              if az containerapp show --resource-group "${AZURE_RESOURCE_GROUP_NAME}" --name "${app_name}" --output none 2>/dev/null; then
                existing_count=$((existing_count + 1))
              fi
            done

            if [[ "${existing_count}" -eq 3 ]]; then
              resolve_existing=true
            elif [[ "${existing_count}" -ne 0 ]]; then
              printf 'Found %s of 3 expected Container Apps in %s. Refusing placeholder bootstrap because it could replace existing production apps. Repair the partial infra manually or remove the partial apps first.\n' \
                "${existing_count}" "${AZURE_RESOURCE_GROUP_NAME}" >&2
              exit 1
            fi
          fi

          if [[ "${resolve_existing}" == "true" ]]; then
            acr_json="$(az acr list \
              --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
              --output json \
              | jq --arg app "${APP_NAME}" --arg env "${AZURE_ENVIRONMENT_NAME}" \
                '.[] | select(.tags.app == $app and .tags.environment == $env)' \
              | jq -s '.')"
            acr_count="$(jq 'length' <<< "${acr_json}")"
            if [[ "${acr_count}" -ne 1 ]]; then
              printf 'Expected exactly one ACR tagged app=%s environment=%s in resource group %s, found %s.\n' \
                "${APP_NAME}" "${AZURE_ENVIRONMENT_NAME}" "${AZURE_RESOURCE_GROUP_NAME}" "${acr_count}" >&2
              exit 1
            fi

            api_fqdn="$(az containerapp show --resource-group "${AZURE_RESOURCE_GROUP_NAME}" --name "${api_app_name}" --query properties.configuration.ingress.fqdn --output tsv)"
            web_fqdn="$(az containerapp show --resource-group "${AZURE_RESOURCE_GROUP_NAME}" --name "${web_app_name}" --query properties.configuration.ingress.fqdn --output tsv)"
            admin_fqdn="$(az containerapp show --resource-group "${AZURE_RESOURCE_GROUP_NAME}" --name "${admin_app_name}" --query properties.configuration.ingress.fqdn --output tsv)"

            generated_api_url="https://${api_fqdn}"
            generated_web_url="https://${web_fqdn}"
            generated_admin_url="https://${admin_fqdn}"
            public_api_url="${PUBLIC_API_URL:-${generated_api_url}}"
            public_web_url="${PUBLIC_WEB_URL:-${generated_web_url}}"
            public_admin_url="${PUBLIC_ADMIN_URL:-${generated_admin_url}}"

            {
              echo "acr_name=$(jq -er '.[0].name' <<< "${acr_json}")"
              echo "acr_login_server=$(jq -er '.[0].loginServer' <<< "${acr_json}")"
              echo "api_app_name=${api_app_name}"
              echo "web_app_name=${web_app_name}"
              echo "admin_app_name=${admin_app_name}"
              echo "api_url=${generated_api_url}"
              echo "web_url=${generated_web_url}"
              echo "admin_url=${generated_admin_url}"
              echo "public_api_url=${public_api_url}"
              echo "public_web_url=${public_web_url}"
              echo "public_admin_url=${public_admin_url}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          az deployment sub create \
            --name "bootstrap-production-${GITHUB_RUN_ID}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              resourceGroupName="${AZURE_RESOURCE_GROUP_NAME}" \
              appName="${APP_NAME}" \
              environmentName="${AZURE_ENVIRONMENT_NAME}" \
              postgresServerFqdn="${POSTGRES_SERVER_FQDN}" \
              postgresRuntimeLogin="${POSTGRES_RUNTIME_LOGIN}" \
              postgresRuntimePassword="${POSTGRES_RUNTIME_PASSWORD}" \
              postgresDatabaseName="${POSTGRES_DATABASE_NAME}" \
              apiImage="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              enableContainerAppProbes=false \
              webImage="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              adminImage="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              alertOperatorEmail="${AZURE_ALERT_OPERATOR_EMAIL}" \
            --query properties.outputs \
            --output json > deployment-outputs.json

          {
            echo "acr_name=$(jq -er '.acrName.value' deployment-outputs.json)"
            echo "acr_login_server=$(jq -er '.acrLoginServer.value' deployment-outputs.json)"
            echo "api_app_name=$(jq -er '.apiAppName.value' deployment-outputs.json)"
            echo "web_app_name=$(jq -er '.webAppName.value' deployment-outputs.json)"
            echo "admin_app_name=$(jq -er '.adminAppName.value' deployment-outputs.json)"
            generated_api_url="https://$(jq -er '.apiFqdn.value' deployment-outputs.json)"
            generated_web_url="https://$(jq -er '.webFqdn.value' deployment-outputs.json)"
            generated_admin_url="https://$(jq -er '.adminFqdn.value' deployment-outputs.json)"
            public_api_url="${PUBLIC_API_URL:-${generated_api_url}}"
            public_web_url="${PUBLIC_WEB_URL:-${generated_web_url}}"
            public_admin_url="${PUBLIC_ADMIN_URL:-${generated_admin_url}}"
            echo "api_url=${generated_api_url}"
            echo "web_url=${generated_web_url}"
            echo "admin_url=${generated_admin_url}"
            echo "public_api_url=${public_api_url}"
            echo "public_web_url=${public_web_url}"
            echo "public_admin_url=${public_admin_url}"
          } >> "${GITHUB_OUTPUT}"
      - name: Resolve authentication cookie domain
        shell: bash
        env:
          GENERATED_API_URL: ${{ steps.infra.outputs.api_url }}
        run: bash .github/scripts/resolve-cookie-domain.sh


      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.infra.outputs.acr_name }}"


      - name: Build and push API image
        id: api-image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.infra.outputs.acr_login_server }}/api:${GITHUB_SHA}"
          docker build \
            --file apps/api/Dockerfile \
            --tag "${image}" \
            .
          docker push "${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push web image
        id: web-image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.infra.outputs.acr_login_server }}/web:${GITHUB_SHA}"
          docker build \
            --file apps/web/Dockerfile \
            --tag "${image}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ steps.infra.outputs.public_web_url }}" \
            --build-arg NEXT_PUBLIC_ADMIN_APP_URL="${{ steps.infra.outputs.public_admin_url }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="${NEXT_PUBLIC_APP_NAME}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.infra.outputs.public_api_url }}" \
            .
          docker push "${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push admin image
        id: admin-image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.infra.outputs.acr_login_server }}/admin:${GITHUB_SHA}"
          docker build \
            --file apps/admin/Dockerfile \
            --tag "${image}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ steps.infra.outputs.public_admin_url }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="${NEXT_PUBLIC_ADMIN_APP_NAME}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.infra.outputs.public_api_url }}" \
            --build-arg NEXT_PUBLIC_MAIN_APP_URL="${{ steps.infra.outputs.public_web_url }}" \
            .
          docker push "${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Add temporary PostgreSQL firewall rule
        id: postgres-firewall
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsSL https://api.ipify.org)"
          postgres_server_host="${POSTGRES_SERVER_FQDN%%:*}"
          postgres_server_name="${postgres_server_host%%.postgres.database.azure.com}"
          rule_name="github-actions-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create \
            --resource-group "${POSTGRES_FIREWALL_RESOURCE_GROUP_NAME}" \
            --server-name "${postgres_server_name}" \
            --name "${rule_name}" \
            --start-ip-address "${runner_ip}" \
            --end-ip-address "${runner_ip}" \
            --output none
          {
            echo "postgres_server_name=${postgres_server_name}"
            echo "rule_name=${rule_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Provision PostgreSQL roles and grants
        shell: bash
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_MIGRATION_PASSWORD: ${{ secrets.POSTGRES_MIGRATION_PASSWORD }}
          POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          encoded_admin_login="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_ADMIN_LOGIN"], safe=""))')"
          encoded_admin_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_ADMIN_PASSWORD"], safe=""))')"
          encoded_database_name="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_DATABASE_NAME"], safe=""))')"
          postgres_server_host="${POSTGRES_SERVER_FQDN%%:*}"
          admin_database_url="postgresql://${encoded_admin_login}:${encoded_admin_password}@${postgres_server_host}:5432/${encoded_database_name}?sslmode=require"
          echo "::add-mask::${encoded_admin_password}"
          echo "::add-mask::${admin_database_url}"
          PGCONNECT_TIMEOUT=15 psql "${admin_database_url}" \
            --set=migration_role="${POSTGRES_MIGRATION_LOGIN}" \
            --set=migration_password="${POSTGRES_MIGRATION_PASSWORD}" \
            --set=runtime_role="${POSTGRES_RUNTIME_LOGIN}" \
            --set=runtime_password="${POSTGRES_RUNTIME_PASSWORD}" \
            --file=.github/scripts/provision-postgres-roles.sql

      - name: Run database migrations
        shell: bash
        env:
          POSTGRES_MIGRATION_PASSWORD: ${{ secrets.POSTGRES_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail
          encoded_login="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_MIGRATION_LOGIN"], safe=""))')"
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_MIGRATION_PASSWORD"], safe=""))')"
          encoded_database_name="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_DATABASE_NAME"], safe=""))')"
          echo "::add-mask::${encoded_password}"
          postgres_server_host="${POSTGRES_SERVER_FQDN%%:*}"
          export MIGRATION_DATABASE_URL="postgresql://${encoded_login}:${encoded_password}@${postgres_server_host}:5432/${encoded_database_name}?sslmode=require"
          echo "::add-mask::${MIGRATION_DATABASE_URL}"
          for attempt in {1..6}; do
            if bun run db:migrate; then
              exit 0
            fi

            if [[ "${attempt}" -eq 6 ]]; then
              echo "Database migration failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Database migration attempt ${attempt} failed; retrying in 10 seconds." >&2
            sleep 10
          done

      - name: Remove temporary PostgreSQL firewall rule
        if: always() && steps.postgres-firewall.outputs.postgres_server_name != '' && steps.postgres-firewall.outputs.rule_name != ''
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server firewall-rule delete \
            --resource-group "${POSTGRES_FIREWALL_RESOURCE_GROUP_NAME}" \
            --server-name "${{ steps.postgres-firewall.outputs.postgres_server_name }}" \
            --name "${{ steps.postgres-firewall.outputs.rule_name }}" \
            --yes \
            --output none

      - name: Deploy final Azure infrastructure
        shell: bash
        env:
          POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "deploy-production-${GITHUB_RUN_ID}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              resourceGroupName="${AZURE_RESOURCE_GROUP_NAME}" \
              appName="${APP_NAME}" \
              environmentName="${AZURE_ENVIRONMENT_NAME}" \
              postgresServerFqdn="${POSTGRES_SERVER_FQDN}" \
              postgresRuntimeLogin="${POSTGRES_RUNTIME_LOGIN}" \
              postgresRuntimePassword="${POSTGRES_RUNTIME_PASSWORD}" \
              postgresDatabaseName="${POSTGRES_DATABASE_NAME}" \
              apiImage="${{ steps.api-image.outputs.image }}" \
              enableContainerAppProbes=false \
              webImage="${{ steps.web-image.outputs.image }}" \
              adminImage="${{ steps.admin-image.outputs.image }}" \
              alertOperatorEmail="${AZURE_ALERT_OPERATOR_EMAIL}" \
            --output none

      - name: Bind custom public hostnames
        shell: bash
        run: |
          set -euo pipefail
          bindings=(
            "${{ steps.infra.outputs.api_app_name }}|${{ steps.infra.outputs.api_url }}|${{ steps.infra.outputs.public_api_url }}"
            "${{ steps.infra.outputs.web_app_name }}|${{ steps.infra.outputs.web_url }}|${{ steps.infra.outputs.public_web_url }}"
            "${{ steps.infra.outputs.admin_app_name }}|${{ steps.infra.outputs.admin_url }}|${{ steps.infra.outputs.public_admin_url }}"
          )

          for binding in "${bindings[@]}"; do
            IFS='|' read -r app_name generated_url public_url <<< "${binding}"
            generated_url="${generated_url%/}"
            public_url="${public_url%/}"
            if [[ "${public_url}" == "${generated_url}" ]]; then
              continue
            fi

            hostname="${public_url#*://}"
            hostname="${hostname%%/*}"
            hostname="${hostname%%:*}"
            if [[ -z "${hostname}" ]]; then
              printf 'Could not resolve a hostname from public URL %s.\n' "${public_url}" >&2
              exit 1
            fi

            environment_id="$(az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
              --name "${app_name}" \
              --query properties.managedEnvironmentId \
              --output tsv)"
            az containerapp hostname bind \
              --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
              --name "${app_name}" \
              --hostname "${hostname}" \
              --environment "${environment_id}" \
              --validation-method CNAME \
              --output none
          done

      - name: Configure API secrets
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BILLING_RECONCILIATION_SECRET: ${{ secrets.BILLING_RECONCILIATION_SECRET }}
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          INNGEST_SIGNING_KEY_FALLBACK: ${{ secrets.INNGEST_SIGNING_KEY_FALLBACK }}
          DODO_PAYMENTS_WEBHOOK_SECRET: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          AZURE_AI_FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
        run: |
          set -euo pipefail
          secret_args=(
            "better-auth-secret=${BETTER_AUTH_SECRET}"
            "jwt-secret=${JWT_SECRET}"
            "admin-secret=${ADMIN_SECRET}"
            "billing-reconciliation-secret=${BILLING_RECONCILIATION_SECRET}"
            "dodo-api-key=${DODO_PAYMENTS_API_KEY}"
            "inngest-event-key=${INNGEST_EVENT_KEY}"
            "inngest-signing-key=${INNGEST_SIGNING_KEY}"
            "dodo-webhook-secret=${DODO_PAYMENTS_WEBHOOK_SECRET}"
          )
          if [[ -n "${INNGEST_SIGNING_KEY_FALLBACK}" ]]; then
            secret_args+=("inngest-signing-key-fallback=${INNGEST_SIGNING_KEY_FALLBACK}")
          fi
          if [[ -n "${AZURE_AI_FOUNDRY_API_KEY}" ]]; then
            secret_args+=("azure-ai-foundry-api-key=${AZURE_AI_FOUNDRY_API_KEY}")
          fi


          if [[ -n "${RESEND_API_KEY}" ]]; then
            secret_args+=("resend-api-key=${RESEND_API_KEY}")
          fi

          if [[ -n "${GOOGLE_CLIENT_SECRET}" ]]; then
            secret_args+=("google-client-secret=${GOOGLE_CLIENT_SECRET}")
          fi

          if [[ -n "${GITHUB_CLIENT_SECRET}" ]]; then
            secret_args+=("github-client-secret=${GITHUB_CLIENT_SECRET}")
          fi

          az containerapp secret set \
            --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
            --name "${{ steps.infra.outputs.api_app_name }}" \
            --secrets \
              "${secret_args[@]}" \
            --output none

      - name: Configure API environment variables
        shell: bash
        env:
          ADMIN_ALLOWLIST: ${{ secrets.ADMIN_ALLOWLIST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          INNGEST_SIGNING_KEY_FALLBACK: ${{ secrets.INNGEST_SIGNING_KEY_FALLBACK }}
          AZURE_AI_FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
        run: |
          set -euo pipefail
          env_args=(
            NODE_ENV=production
            PORT=3302
            LOG_LEVEL=info
            "APP_URL=${{ steps.infra.outputs.public_web_url }}"
            "API_URL=${{ steps.infra.outputs.public_api_url }}"
            "ADMIN_APP_URL=${{ steps.infra.outputs.public_admin_url }}"
            COOKIE_SAMESITE=lax
            TRUST_PROXY=true
            "ADMIN_ALLOWLIST=${ADMIN_ALLOWLIST}"
            PAYMENT_PROVIDER=dodo
            "ADMIN_PORTAL_TOTP_REQUIRED=${ADMIN_PORTAL_TOTP_REQUIRED}"
            "DODO_PAYMENTS_ENVIRONMENT=${DODO_PAYMENTS_ENVIRONMENT}"
            "DODO_LIVE_MODE_APPROVED=${DODO_LIVE_MODE_APPROVED}"
            "INNGEST_APP_ID=${INNGEST_APP_ID}"
            INNGEST_DEV=false
            INNGEST_EVENT_KEY=secretref:inngest-event-key
            INNGEST_SIGNING_KEY=secretref:inngest-signing-key
            "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}"
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
            JWT_ISSUER=api-production
            JWT_AUDIENCE=mobile-clients
            DATABASE_URL=secretref:database-url
            AZURE_PRIVACY_EXPORT_STORAGE_CONNECTION_STRING=secretref:privacy-export-storage-connection-string
            AZURE_PRIVACY_EXPORT_STORAGE_CONTAINER=privacy-exports
            BETTER_AUTH_SECRET=secretref:better-auth-secret
            JWT_SECRET=secretref:jwt-secret
            ADMIN_SECRET=secretref:admin-secret
            BILLING_RECONCILIATION_SECRET=secretref:billing-reconciliation-secret
            DODO_PAYMENTS_API_KEY=secretref:dodo-api-key
            DODO_PAYMENTS_WEBHOOK_SECRET=secretref:dodo-webhook-secret
          )

          if [[ -n "${INNGEST_SIGNING_KEY_FALLBACK}" ]]; then
            env_args+=(INNGEST_SIGNING_KEY_FALLBACK=secretref:inngest-signing-key-fallback)
          fi

          if [[ -n "${AZURE_AI_FOUNDRY_PROJECT_ENDPOINT}" && -n "${AZURE_AI_FOUNDRY_MODEL}" && -n "${AZURE_AI_FOUNDRY_API_KEY}" ]]; then
            env_args+=(
              "AZURE_AI_FOUNDRY_PROJECT_ENDPOINT=${AZURE_AI_FOUNDRY_PROJECT_ENDPOINT}"
              AZURE_AI_FOUNDRY_API_KEY=secretref:azure-ai-foundry-api-key
              "AZURE_AI_FOUNDRY_MODEL=${AZURE_AI_FOUNDRY_MODEL}"
              "AZURE_AI_FOUNDRY_TIMEOUT_MS=${AZURE_AI_FOUNDRY_TIMEOUT_MS}"
            )
          fi

          brand_names=(DODO_CREDITS_BRAND_ID DODO_SUBSCRIPTIONS_BRAND_ID DODO_TRANSACTIONS_BRAND_ID)
          for name in "${brand_names[@]}"; do
            effective_name="EFFECTIVE_${name}"
            if [[ -n "${!effective_name}" ]]; then
              env_args+=("${name}=${!effective_name}")
            fi
          done

          env_args+=("COOKIE_DOMAIN=${EFFECTIVE_COOKIE_DOMAIN}")

          if [[ -n "${BETTER_AUTH_ALLOWED_ORIGINS}" ]]; then
            env_args+=("BETTER_AUTH_ALLOWED_ORIGINS=${BETTER_AUTH_ALLOWED_ORIGINS}")
          fi

          if [[ -n "${RESEND_API_KEY}" ]]; then
            env_args+=(RESEND_API_KEY=secretref:resend-api-key)
          fi

          if [[ -n "${GOOGLE_CLIENT_SECRET}" ]]; then
            env_args+=(GOOGLE_CLIENT_SECRET=secretref:google-client-secret)
          fi

          if [[ -n "${GITHUB_CLIENT_SECRET}" ]]; then
            env_args+=(GITHUB_CLIENT_SECRET=secretref:github-client-secret)
          fi

          az containerapp update \
            --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
            --name "${{ steps.infra.outputs.api_app_name }}" \
            --set-env-vars \
              "${env_args[@]}" \
            --output none

      - name: Enable Container App health probes
        shell: bash
        run: |
          set -euo pipefail
          apps=(
            "${{ steps.infra.outputs.api_app_name }}:3302"
            "${{ steps.infra.outputs.web_app_name }}:3300"
            "${{ steps.infra.outputs.admin_app_name }}:3301"
          )

          for app_spec in "${apps[@]}"; do
            app_name="${app_spec%%:*}"
            port="${app_spec##*:}"
            app_id="$(az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
              --name "${app_name}" \
              --query id \
              --output tsv)"
            template="$(az containerapp show \
              --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
              --name "${app_name}" \
              --query properties.template \
              --output json)"
            patch_body="$(jq -cn \
              --argjson template "${template}" \
              --argjson port "${port}" \
              '{properties:{template:($template | del(.scale.cooldownPeriod, .scale.pollingInterval) | .containers[0].probes=[
                {"type":"Liveness","httpGet":{"path":"/health","port":$port},"initialDelaySeconds":30,"periodSeconds":30,"timeoutSeconds":5,"failureThreshold":3},
                {"type":"Readiness","httpGet":{"path":"/ready","port":$port},"initialDelaySeconds":10,"periodSeconds":10,"timeoutSeconds":5,"failureThreshold":3,"successThreshold":1}
              ])}}')"

            az rest \
              --method patch \
              --uri "https://management.azure.com${app_id}?api-version=2024-03-01" \
              --body "${patch_body}" \
              --output none
          done

      - name: Wait for health probe provisioning
        shell: bash
        run: |
          set -euo pipefail
          apps=(
            "${{ steps.infra.outputs.api_app_name }}"
            "${{ steps.infra.outputs.web_app_name }}"
            "${{ steps.infra.outputs.admin_app_name }}"
          )

          for app_name in "${apps[@]}"; do
            for attempt in {1..30}; do
              state="$(az containerapp show \
                --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
                --name "${app_name}" \
                --query properties.provisioningState \
                --output tsv)"

              if [[ "${state}" == "Succeeded" ]]; then
                break
              fi

              if [[ "${attempt}" -eq 30 ]]; then
                printf 'Container App %s provisioning did not reach Succeeded after 30 attempts.\n' "${app_name}" >&2
                exit 1
              fi

              printf 'Container App %s provisioning state is %s on attempt %s; waiting 10 seconds.\n' \
                "${app_name}" "${state:-unknown}" "${attempt}"
              sleep 10
            done
          done

      - name: Deploy API image
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "${AZURE_RESOURCE_GROUP_NAME}" \
            --name "${{ steps.infra.outputs.api_app_name }}" \
            --image "${{ steps.api-image.outputs.image }}" \
            --output none

      - name: Check production readiness
        shell: bash
        run: |
          set -euo pipefail
          readiness_urls=(
            "${{ steps.infra.outputs.api_url }}/ready"
            "${{ steps.infra.outputs.web_url }}/ready"
            "${{ steps.infra.outputs.admin_url }}/ready"
            "${{ steps.infra.outputs.public_api_url }}/ready"
            "${{ steps.infra.outputs.public_web_url }}/ready"
            "${{ steps.infra.outputs.public_admin_url }}/ready"
          )
          for readiness_url in "${readiness_urls[@]}"; do
            curl --fail-with-body --silent --show-error \
              --retry 12 \
              --retry-delay 10 \
              --retry-all-errors \
              "${readiness_url}" >/dev/null
          done

      - name: Print production URLs
        shell: bash
        run: |
          set -euo pipefail
          printf 'API: %s\n' "${{ steps.infra.outputs.api_url }}"
          printf 'Web: %s\n' "${{ steps.infra.outputs.web_url }}"
          printf 'Admin: %s\n' "${{ steps.infra.outputs.admin_url }}"
