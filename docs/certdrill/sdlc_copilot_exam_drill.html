<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1720;
    --panel: #16212f;
    --panel-raised: #1c293a;
    --grid-line: rgba(94, 200, 216, 0.07);
    --hairline: #2a3b57;
    --accent: #e8a33d;
    --accent-dim: rgba(232, 163, 61, 0.16);
    --correct: #4cae7d;
    --correct-dim: rgba(76, 174, 125, 0.14);
    --incorrect: #d9614f;
    --incorrect-dim: rgba(217, 97, 79, 0.14);
    --paper: #e8ecf1;
    --muted: #7e8ca3;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  .quiz-app {
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--ink);
    font-family: var(--font-body);
    color: var(--paper);
    padding: 32px 16px 48px;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .quiz-wrap { width: 100%; max-width: 640px; }

  /* --- title block, styled like an engineering-drawing stamp --- */
  .stamp-header { margin-bottom: 28px; }
  .stamp-box {
    display: inline-flex;
    gap: 0;
    border: 1px solid var(--hairline);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 18px;
    background: var(--panel);
  }
  .stamp-cell {
    padding: 6px 12px;
    border-right: 1px solid var(--hairline);
    white-space: nowrap;
  }
  .stamp-cell:last-child { border-right: none; }
  .stamp-cell b { color: var(--accent); font-weight: 600; }

  .stamp-header h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .stamp-header .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
    line-height: 1.5;
  }

  /* --- progress ruler --- */
  .ruler {
    display: flex;
    gap: 4px;
    margin: 24px 0 20px;
  }
  .tick {
    flex: 1;
    height: 4px;
    background: var(--hairline);
    border-radius: 1px;
    position: relative;
  }
  .tick.done { background: var(--accent); }
  .tick.current { background: var(--paper); }

  .q-counter {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }
  .q-counter b { color: var(--paper); }

  /* --- quiz card --- */
  .quiz-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 26px 26px 22px;
  }

  .q-stem {
    font-size: 17px;
    line-height: 1.55;
    margin: 0 0 20px;
    color: var(--paper);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--paper);
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(.locked) { border-color: var(--accent); }
  .option.selected { border-color: var(--accent); background: var(--accent-dim); }
  .option.correct { border-color: var(--correct); background: var(--correct-dim); }
  .option.incorrect { border-color: var(--incorrect); background: var(--incorrect-dim); }
  .option.locked { cursor: default; }

  .badge {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--hairline);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .option.selected .badge { border-color: var(--accent); color: var(--accent); }
  .option.correct .badge { border-color: var(--correct); color: var(--correct); background: var(--correct); color: var(--ink); }
  .option.incorrect .badge { border-color: var(--incorrect); color: var(--incorrect); background: var(--incorrect); color: var(--ink); }

  .explain {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 3px;
    font-size: 13.5px;
    line-height: 1.6;
    display: none;
  }
  .explain.show { display: block; }
  .explain.right { background: var(--correct-dim); border: 1px solid var(--correct); color: var(--paper); }
  .explain.wrong { background: var(--incorrect-dim); border: 1px solid var(--incorrect); color: var(--paper); }
  .explain .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 6px;
  }
  .explain.right .tag { color: var(--correct); }
  .explain.wrong .tag { color: var(--incorrect); }

  .action-row {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
  }
  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--ink);
    transition: opacity 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:hover:not(:disabled) { opacity: 0.88; }

  .score-footer {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
  }
  .score-footer b { color: var(--accent); font-size: 13px; }

  /* --- results screen --- */
  .results { text-align: center; padding: 10px 0 4px; }
  .results .big-score {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    margin: 4px 0 2px;
  }
  .results .big-score span { font-size: 22px; color: var(--muted); font-weight: 500; }
  .results .verdict { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  .results .btn { display: inline-block; }

  @media (max-width: 480px) {
    .stamp-header h1 { font-size: 21px; }
    .quiz-card { padding: 20px 18px 18px; }
    .stamp-box { font-size: 10px; }
  }
</style>

<div class="quiz-app">
  <div class="quiz-wrap">
    <div class="stamp-header">
      <div class="stamp-box">
        <div class="stamp-cell">DOC <b>SDLC-COPILOT</b></div>
        <div class="stamp-cell">REV <b>1.0</b></div>
        <div class="stamp-cell">SRC <b>MS Learn, Unit 4</b></div>
      </div>
      <h1>AI in the SDLC — Certification Drill</h1>
      <p class="subtitle">10 difficult questions on how GitHub Copilot maps to the SDLC and to orchestrated multi-agent workflows.</p>
    </div>

    <div class="q-counter">QUESTION <b id="qNum">1</b> / <span id="qTotal">10</span></div>
    <div class="ruler" id="ruler"></div>

    <div class="quiz-card" id="quizCard"></div>

    <div class="score-footer">
      <span>RUNNING SCORE</span>
      <b id="scoreValue">0 / 10</b>
    </div>
  </div>
</div>

<script>
  const questions = [
    {
      stem: "Which statement most accurately describes GitHub Copilot's role in the Requirement Analysis phase?",
      options: [
        "It directly gathers stakeholder requirements through a conversational interface",
        "It doesn't gather requirements directly, but helps translate them into initial code structures — rapid prototypes, user story implementations, and API designs",
        "It automatically produces a complete requirements specification document from a product brief",
        "It replaces business analysts by conducting requirement elicitation interviews",
        "It has no application at all during requirement analysis"
      ],
      correct: 1,
      explain: "The unit is explicit that Copilot 'doesn't directly gather requirements,' but assists by turning them into rapid prototypes, user story implementations, and API design suggestions."
    },
    {
      stem: "Which of the following is NOT listed under the Design & Development phase?",
      options: [
        "Boilerplate code generation",
        "Design pattern implementation",
        "Code optimization",
        "Cross-language translation",
        "Configuration file generation for deployment environments"
      ],
      correct: 4,
      explain: "Configuration file generation is listed under the Deployment phase, not Design & Development. Boilerplate, design patterns, optimization, and cross-language translation are all Design & Development items."
    },
    {
      stem: "The module separates basic 'Testing & quality assurance' from a more advanced subsection. What is that subsection, and which item belongs there rather than in the basic list?",
      options: [
        "'Test Governance' — Assertion suggestions",
        "'Automated testing workflows' — Test suite architecture, designing complete frameworks spanning unit, integration, and end-to-end tests",
        "'CI/CD Testing' — Unit test creation",
        "'Quality Engineering' — Edge case identification",
        "'Automated testing workflows' — Test data generation"
      ],
      correct: 1,
      explain: "'Automated testing workflows' is the advanced subsection, and 'test suite architecture' (designing complete frameworks across unit/integration/e2e tests) sits there — distinct from the basic list's unit test creation, test data generation, edge case identification, and assertion suggestions."
    },
    {
      stem: "In the two-agent Draft agent / Review agent pattern, which responsibility belongs to the Review agent rather than the Draft agent?",
      options: [
        "Generating basic unit tests covering main scenarios",
        "Writing inline documentation explaining the implementation",
        "Security vulnerability identification",
        "Analyzing feature requirements to generate the initial implementation",
        "Establishing integration points with existing code"
      ],
      correct: 2,
      explain: "The Review agent handles code quality assessment, security vulnerability identification, performance optimization suggestions, and architectural compliance — the Draft agent handles the initial implementation, its tests, docs, and integration points."
    },
    {
      stem: "Per the module's note on PRU (Premium Request Unit) consumption, what does a typical 2-agent draft–review flow cost, and what's the per-handoff rate?",
      options: [
        "~1–2 PRUs total; 0.5 PRU per handoff",
        "~2–3 PRUs total; ~1 PRU per handoff",
        "~4+ PRUs total; ~2 PRU per handoff",
        "~5–6 PRUs total; ~3 PRU per handoff",
        "Handoffs don't consume PRUs — only premium reasoning does"
      ],
      correct: 1,
      explain: "The note states each handoff consumes ~1 PRU, and a 2-agent draft–review flow typically uses 2–3 PRUs total."
    },
    {
      stem: "How does the module describe the PRU impact of enabling premium reasoning integration for advanced orchestration?",
      options: [
        "It reduces PRU consumption because fewer handoffs are needed",
        "It keeps PRU consumption identical to standard runs, just slower",
        "It often roughly doubles PRU consumption, to approximately 4+ per request",
        "It caps PRU consumption at exactly 1 PRU regardless of complexity",
        "PRU consumption becomes unmeasurable once premium reasoning is enabled"
      ],
      correct: 2,
      explain: "The note says premium runs 'often double PRU consumption (~4+ per request)' compared to standard orchestration."
    },
    {
      stem: "Which capability is specifically listed under 'Premium reasoning integration' for advanced orchestration?",
      options: [
        "Unit test creation based on function signatures",
        "Cross-system impact analysis — understanding how a change in one component affects other parts of a distributed system",
        "Configuration file generation for deployment environments",
        "Legacy code understanding with modern equivalents",
        "Test data generation for realistic datasets"
      ],
      correct: 1,
      explain: "Premium reasoning integration lists architectural decision support, cross-system impact analysis, complex refactoring coordination, and integration pattern optimization — the others belong to basic testing, deployment, or maintenance."
    },
    {
      stem: "The 'Comprehensive feature delivery workflow' lists five ordered phases. What is the correct order?",
      options: [
        "Implementation → Analysis → Quality Assurance → Deployment → Documentation",
        "Analysis → Implementation → Quality Assurance → Documentation → Deployment",
        "Analysis → Quality Assurance → Implementation → Documentation → Deployment",
        "Documentation → Analysis → Implementation → Quality Assurance → Deployment",
        "Analysis → Implementation → Documentation → Quality Assurance → Deployment"
      ],
      correct: 1,
      explain: "The module lists: Analysis phase → Implementation phase → Quality assurance phase → Documentation phase → Deployment phase."
    },
    {
      stem: "Which statement best matches the module's framing of Copilot's role in Deployment?",
      options: [
        "Copilot directly executes deployment processes and manages infrastructure",
        "Copilot has no relevance to deployment whatsoever",
        "While not directly involved in deployment processes, Copilot can assist with configuration files, deployment scripts, and documentation updates",
        "Copilot's deployment role is limited exclusively to writing rollback scripts",
        "Copilot fully automates CI/CD pipeline provisioning without human input"
      ],
      correct: 2,
      explain: "The module says Copilot is 'not directly involved in deployment processes' but assists with configuration files, deployment script suggestions, and documentation updates."
    },
    {
      stem: "Which of these belongs to Maintenance & Support rather than Testing & QA?",
      options: [
        "Edge case identification",
        "Assertion suggestions",
        "Legacy code understanding — explaining unfamiliar or legacy code and offering modern equivalents",
        "Test data generation",
        "Unit test creation"
      ],
      correct: 2,
      explain: "Legacy code understanding is a Maintenance & Support item. Edge case identification, assertion suggestions, test data generation, and unit test creation are all Testing & QA items."
    }
  ];

  let current = 0;
  let score = 0;
  let selected = null;
  let answered = false;

  const qNumEl = document.getElementById('qNum');
  const qTotalEl = document.getElementById('qTotal');
  const rulerEl = document.getElementById('ruler');
  const cardEl = document.getElementById('quizCard');
  const scoreEl = document.getElementById('scoreValue');

  qTotalEl.textContent = questions.length;

  function renderRuler() {
    rulerEl.innerHTML = '';
    questions.forEach((_, i) => {
      const t = document.createElement('div');
      t.className = 'tick' + (i < current ? ' done' : i === current ? ' current' : '');
      rulerEl.appendChild(t);
    });
  }

  function letter(i) { return String.fromCharCode(65 + i); }

  function renderQuestion() {
    selected = null;
    answered = false;
    qNumEl.textContent = current + 1;
    renderRuler();

    const q = questions[current];
    let html = `<p class="q-stem">${q.stem}</p><div class="options" id="optionsRow">`;
    q.options.forEach((opt, i) => {
      html += `<button class="option" data-i="${i}">
                 <span class="badge">${letter(i)}</span>
                 <span>${opt}</span>
               </button>`;
    });
    html += `</div><div class="explain" id="explainBox"></div>
             <div class="action-row"><button class="btn" id="actionBtn" disabled>Check answer</button></div>`;
    cardEl.innerHTML = html;

    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (answered) return;
        document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selected = parseInt(btn.dataset.i, 10);
        document.getElementById('actionBtn').disabled = false;
      });
    });

    document.getElementById('actionBtn').addEventListener('click', onAction);
  }

  function onAction() {
    if (!answered) {
      lockAndReveal();
    } else {
      current++;
      if (current >= questions.length) {
        renderResults();
      } else {
        renderQuestion();
      }
    }
  }

  function lockAndReveal() {
    answered = true;
    const q = questions[current];
    const isRight = selected === q.correct;
    if (isRight) score++;
    scoreEl.textContent = `${score} / ${questions.length}`;

    document.querySelectorAll('.option').forEach((btn, i) => {
      btn.classList.add('locked');
      if (i === q.correct) btn.classList.add('correct');
      else if (i === selected) btn.classList.add('incorrect');
    });

    const box = document.getElementById('explainBox');
    box.classList.add('show', isRight ? 'right' : 'wrong');
    box.innerHTML = `<span class="tag">${isRight ? 'CORRECT' : 'INCORRECT'}</span>${q.explain}`;

    const actionBtn = document.getElementById('actionBtn');
    actionBtn.textContent = current === questions.length - 1 ? 'See results' : 'Next question';
    actionBtn.disabled = false;
  }

  function renderResults() {
    current = questions.length;
    renderRuler();
    qNumEl.textContent = questions.length;
    const pct = Math.round((score / questions.length) * 100);
    let verdict;
    if (pct === 100) verdict = "Clean sweep. You know this unit cold.";
    else if (pct >= 80) verdict = "Strong. A couple of details to tighten up.";
    else if (pct >= 50) verdict = "Decent foundation, but re-read the orchestration and PRU sections.";
    else verdict = "Worth another full pass through the source unit before testing again.";

    cardEl.innerHTML = `
      <div class="results">
        <div class="big-score">${score}<span> / ${questions.length}</span></div>
        <div class="verdict">${verdict} (${pct}%)</div>
        <button class="btn" id="restartBtn">Restart drill</button>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', () => {
      current = 0; score = 0;
      scoreEl.textContent = `0 / ${questions.length}`;
      renderQuestion();
    });
  }

  renderQuestion();
</script>
